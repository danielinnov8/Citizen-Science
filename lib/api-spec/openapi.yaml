openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: profiles
    description: Featured scientists & inventors directory
  - name: billing
    description: Credit balance and usage-based billing
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      description: Creates an account with email/password and starts a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      description: Verifies credentials and starts a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      description: Destroys the current session and clears the session cookie.
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated user
      description: Returns the user for the active session, or 401 if not signed in.
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/google:
    get:
      operationId: startGoogleAuth
      tags: [auth]
      summary: Start Google OAuth
      description: >
        Browser-redirect endpoint. Redirects the user to Google's consent
        screen (authorization-code flow with PKCE). Navigate to this URL
        directly via the browser; it is not a JSON/fetch endpoint.
      responses:
        "302":
          description: Redirect to Google's OAuth consent screen
  /auth/google/callback:
    get:
      operationId: googleAuthCallback
      tags: [auth]
      summary: Google OAuth callback
      description: >
        Browser-redirect endpoint. Google redirects back here with an
        authorization code; the server exchanges it, creates or links the
        user, starts a session, and redirects into the web app.
      responses:
        "302":
          description: Redirect back into the web app
  /profiles:
    get:
      operationId: listFeaturedProfiles
      tags: [profiles]
      summary: List featured scientists and inventors
      description: >
        Returns the directory of featured scientists and inventors as
        lightweight summaries (no contributions, quotes, or citations).
      responses:
        "200":
          description: The directory listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeaturedProfileSummary"
  /profiles/{slug}:
    get:
      operationId: getFeaturedProfile
      tags: [profiles]
      summary: Get a featured profile by slug
      description: Returns the full profile for a single scientist or inventor.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedProfile"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /billing/credits:
    get:
      operationId: getCreditBalance
      tags: [billing]
      summary: Get the current credit balance
      description: >
        Returns the credit balance for the caller — a signed-in user or, when
        logged out, the anonymous guest identified by the browser's anon cookie.
        Credits meter all AI features (copilot chat, web-grounded research,
        field-notes analysis, and the talking avatar).
      responses:
        "200":
          description: The caller's credit balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditBalance"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: ["string", "null"]
        image:
          type: ["string", "null"]
      required:
        - id
        - email
        - name
        - image
    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 3
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
      required:
        - email
        - password
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    ProfileSource:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
      required:
        - title
        - url
    ProfilePatent:
      type: object
      properties:
        title:
          type: string
        number:
          type: string
        year:
          type: string
        url:
          type: string
      required:
        - title
        - number
        - url
    ProfileGroup:
      type: string
      enum:
        - scientist
        - inventor
        - thought_leader
    ProfileTimelineEntry:
      type: object
      properties:
        year:
          type: string
        title:
          type: string
        detail:
          type: string
      required:
        - year
        - title
        - detail
    ProfileStoryContribution:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
      required:
        - title
        - detail
    ProfileStoryTheme:
      type: object
      properties:
        accent:
          type: string
        accentSoft:
          type: string
        accentDeep:
          type: string
        heroFrom:
          type: string
        heroTo:
          type: string
        motif:
          type: string
        heroVariant:
          type: string
      required:
        - accent
        - accentSoft
        - accentDeep
        - heroFrom
        - heroTo
        - motif
    FeaturedProfileSummary:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        group:
          $ref: "#/components/schemas/ProfileGroup"
        field:
          type: string
        era:
          type: string
        imageUrl:
          type: ["string", "null"]
      required:
        - id
        - slug
        - name
        - group
        - field
        - era
        - imageUrl
    FeaturedProfile:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        group:
          $ref: "#/components/schemas/ProfileGroup"
        field:
          type: string
        era:
          type: string
        summary:
          type: string
        contributions:
          type: array
          items:
            type: string
        quotes:
          type: array
          items:
            type: string
        imageUrl:
          type: ["string", "null"]
        relatedCategorySlugs:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSource"
        patents:
          type: array
          items:
            $ref: "#/components/schemas/ProfilePatent"
        tagline:
          type: ["string", "null"]
        lifespan:
          type: ["string", "null"]
        birthplace:
          type: ["string", "null"]
        biography:
          type: array
          items:
            type: string
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/ProfileTimelineEntry"
        storyContributions:
          type: array
          items:
            $ref: "#/components/schemas/ProfileStoryContribution"
        legacy:
          type: array
          items:
            type: string
        didYouKnow:
          type: array
          items:
            type: string
        storyTheme:
          anyOf:
            - $ref: "#/components/schemas/ProfileStoryTheme"
            - type: "null"
      required:
        - id
        - slug
        - name
        - group
        - field
        - era
        - summary
        - contributions
        - quotes
        - imageUrl
        - relatedCategorySlugs
        - sources
        - patents
        - tagline
        - lifespan
        - birthplace
        - biography
        - timeline
        - storyContributions
        - legacy
        - didYouKnow
        - storyTheme
    CreditBalance:
      type: object
      properties:
        plan:
          type: string
          description: The plan id ("free", "researcher", "pioneer") or "guest".
        isGuest:
          type: boolean
        monthlyGrant:
          type: integer
          description: Credits granted per month for this plan.
        monthlyRemaining:
          type: integer
          description: Credits left from this month's grant.
        topupBalance:
          type: integer
          description: Non-expiring top-up credits remaining.
        totalRemaining:
          type: integer
          description: monthlyRemaining + topupBalance.
        renewalDate:
          type: string
          format: date-time
          description: When the monthly grant next resets (start of next UTC month).
      required:
        - plan
        - isGuest
        - monthlyGrant
        - monthlyRemaining
        - topupBalance
        - totalRemaining
        - renewalDate
