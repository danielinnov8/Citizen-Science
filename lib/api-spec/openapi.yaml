openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: profiles
    description: Featured scientists & inventors directory
  - name: billing
    description: Credit balance and usage-based billing
  - name: admin
    description: Superadmin platform administration
  - name: citizenx
    description: CitizenX community program — chapters, events, and published experiments
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      description: Creates an account with email/password and starts a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      description: Verifies credentials and starts a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      description: Destroys the current session and clears the session cookie.
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated user
      description: Returns the user for the active session, or 401 if not signed in.
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/google:
    get:
      operationId: startGoogleAuth
      tags: [auth]
      summary: Start Google OAuth
      description: >
        Browser-redirect endpoint. Redirects the user to Google's consent
        screen (authorization-code flow with PKCE). Navigate to this URL
        directly via the browser; it is not a JSON/fetch endpoint.
      responses:
        "302":
          description: Redirect to Google's OAuth consent screen
  /auth/google/callback:
    get:
      operationId: googleAuthCallback
      tags: [auth]
      summary: Google OAuth callback
      description: >
        Browser-redirect endpoint. Google redirects back here with an
        authorization code; the server exchanges it, creates or links the
        user, starts a session, and redirects into the web app.
      responses:
        "302":
          description: Redirect back into the web app
  /profiles:
    get:
      operationId: listFeaturedProfiles
      tags: [profiles]
      summary: List featured scientists and inventors
      description: >
        Returns the directory of featured scientists and inventors as
        lightweight summaries (no contributions, quotes, or citations).
      responses:
        "200":
          description: The directory listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeaturedProfileSummary"
  /profiles/{slug}:
    get:
      operationId: getFeaturedProfile
      tags: [profiles]
      summary: Get a featured profile by slug
      description: Returns the full profile for a single scientist or inventor.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedProfile"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /billing/credits:
    get:
      operationId: getCreditBalance
      tags: [billing]
      summary: Get the current credit balance
      description: >
        Returns the credit balance for the caller — a signed-in user or, when
        logged out, the anonymous guest identified by the browser's anon cookie.
        Credits meter all AI features (copilot chat, web-grounded research,
        field-notes analysis, and the talking avatar).
      responses:
        "200":
          description: The caller's credit balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditBalance"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Admin overview KPIs
      description: Superadmin-only. Headline platform metrics and trend sparklines.
      responses:
        "200":
          description: Overview metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all accounts (searchable, paginated)
      description: Superadmin-only. Paginated, searchable list of accounts with per-user usage.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}/plan:
    patch:
      operationId: updateUserPlan
      tags: [admin]
      summary: Change a user's plan
      description: Superadmin-only. Sets the subscription plan for an account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPlanInput"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}/credits:
    post:
      operationId: grantUserCredits
      tags: [admin]
      summary: Grant top-up credits to a user
      description: Superadmin-only. Adds non-expiring top-up credits to an account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantCreditsInput"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/revenue:
    get:
      operationId: getAdminRevenue
      tags: [admin]
      summary: Projected revenue
      description: Superadmin-only. Projected MRR from plan tiers (no live payment processor).
      responses:
        "200":
          description: Revenue projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRevenue"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/usage:
    get:
      operationId: getAdminUsage
      tags: [admin]
      summary: AI usage aggregates
      description: Superadmin-only. AI consumption over time plus live avatar session count.
      responses:
        "200":
          description: Usage aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsage"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/content:
    get:
      operationId: getAdminContent
      tags: [admin]
      summary: Content & module counts
      description: Superadmin-only. Counts of categories, profiles, partners and labs.
      responses:
        "200":
          description: Content counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContent"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/system:
    get:
      operationId: getAdminSystem
      tags: [admin]
      summary: Feature & integration status board
      description: >
        Superadmin-only. Whether each integration is configured (booleans only,
        never the secret values) plus API health.
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSystem"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/chapters:
    get:
      operationId: listCitizenxChapters
      tags: [citizenx]
      summary: List active CitizenX chapters
      description: Public list of active (approved) CitizenX chapters.
      responses:
        "200":
          description: Active chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenxChapter"
    post:
      operationId: applyCitizenxChapter
      tags: [citizenx]
      summary: Apply to organize a CitizenX chapter
      description: Authenticated. Submits a chapter application in "pending" status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenxChapterInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenxChapter"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/chapters/mine:
    get:
      operationId: listMyCitizenxChapters
      tags: [citizenx]
      summary: List my CitizenX chapter applications
      description: Authenticated. The caller's own chapters, including pending ones.
      responses:
        "200":
          description: The caller's chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenxChapter"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/events:
    get:
      operationId: listCitizenxEvents
      tags: [citizenx]
      summary: List upcoming CitizenX events
      description: Public list of upcoming CitizenX events, soonest first.
      responses:
        "200":
          description: Upcoming events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenxEvent"
    post:
      operationId: createCitizenxEvent
      tags: [citizenx]
      summary: Host a CitizenX event
      description: Authenticated. Creates a publicly listed upcoming event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenxEventInput"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenxEvent"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/events/mine:
    get:
      operationId: listMyCitizenxEvents
      tags: [citizenx]
      summary: List my CitizenX events
      description: Authenticated. Events hosted by the caller.
      responses:
        "200":
          description: The caller's events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenxEvent"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/events/{slug}:
    get:
      operationId: getCitizenxEvent
      tags: [citizenx]
      summary: Get a CitizenX event by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenxEvent"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/experiments:
    get:
      operationId: listCitizenxExperiments
      tags: [citizenx]
      summary: List published CitizenX experiments
      description: Public gallery of member-published experiments, newest first.
      responses:
        "200":
          description: Published experiments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenxExperimentSummary"
    post:
      operationId: publishCitizenxExperiment
      tags: [citizenx]
      summary: Publish a CitizenX experiment
      description: Authenticated. Publishes a shareable experiment authored by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenxExperimentInput"
      responses:
        "201":
          description: Experiment published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenxExperiment"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/experiments/mine:
    get:
      operationId: listMyCitizenxExperiments
      tags: [citizenx]
      summary: List my published CitizenX experiments
      description: Authenticated. Experiments published by the caller.
      responses:
        "200":
          description: The caller's experiments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenxExperimentSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/experiments/{slug}:
    get:
      operationId: getCitizenxExperiment
      tags: [citizenx]
      summary: Get a published CitizenX experiment by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenxExperiment"
        "404":
          description: Experiment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
      required:
        - success
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: ["string", "null"]
        image:
          type: ["string", "null"]
        isSuperAdmin:
          type: boolean
          description: Whether this account is a platform superadmin (admin portal access).
      required:
        - id
        - email
        - name
        - image
        - isSuperAdmin
    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 3
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
      required:
        - email
        - password
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    ProfileSource:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
      required:
        - title
        - url
    ProfilePatent:
      type: object
      properties:
        title:
          type: string
        number:
          type: string
        year:
          type: string
        url:
          type: string
      required:
        - title
        - number
        - url
    ProfileGroup:
      type: string
      enum:
        - scientist
        - inventor
        - thought_leader
    ProfileTimelineEntry:
      type: object
      properties:
        year:
          type: string
        title:
          type: string
        detail:
          type: string
      required:
        - year
        - title
        - detail
    ProfileStoryContribution:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
      required:
        - title
        - detail
    ProfileStoryTheme:
      type: object
      properties:
        accent:
          type: string
        accentSoft:
          type: string
        accentDeep:
          type: string
        heroFrom:
          type: string
        heroTo:
          type: string
        motif:
          type: string
        heroVariant:
          type: string
      required:
        - accent
        - accentSoft
        - accentDeep
        - heroFrom
        - heroTo
        - motif
    FeaturedProfileSummary:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        group:
          $ref: "#/components/schemas/ProfileGroup"
        field:
          type: string
        era:
          type: string
        imageUrl:
          type: ["string", "null"]
      required:
        - id
        - slug
        - name
        - group
        - field
        - era
        - imageUrl
    FeaturedProfile:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        group:
          $ref: "#/components/schemas/ProfileGroup"
        field:
          type: string
        era:
          type: string
        summary:
          type: string
        contributions:
          type: array
          items:
            type: string
        quotes:
          type: array
          items:
            type: string
        imageUrl:
          type: ["string", "null"]
        relatedCategorySlugs:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSource"
        patents:
          type: array
          items:
            $ref: "#/components/schemas/ProfilePatent"
        tagline:
          type: ["string", "null"]
        lifespan:
          type: ["string", "null"]
        birthplace:
          type: ["string", "null"]
        biography:
          type: array
          items:
            type: string
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/ProfileTimelineEntry"
        storyContributions:
          type: array
          items:
            $ref: "#/components/schemas/ProfileStoryContribution"
        legacy:
          type: array
          items:
            type: string
        didYouKnow:
          type: array
          items:
            type: string
        storyTheme:
          anyOf:
            - $ref: "#/components/schemas/ProfileStoryTheme"
            - type: "null"
      required:
        - id
        - slug
        - name
        - group
        - field
        - era
        - summary
        - contributions
        - quotes
        - imageUrl
        - relatedCategorySlugs
        - sources
        - patents
        - tagline
        - lifespan
        - birthplace
        - biography
        - timeline
        - storyContributions
        - legacy
        - didYouKnow
        - storyTheme
    CreditBalance:
      type: object
      properties:
        plan:
          type: string
          description: The plan id ("free", "researcher", "pioneer") or "guest".
        isGuest:
          type: boolean
        monthlyGrant:
          type: integer
          description: Credits granted per month for this plan.
        monthlyRemaining:
          type: integer
          description: Credits left from this month's grant.
        topupBalance:
          type: integer
          description: Non-expiring top-up credits remaining.
        totalRemaining:
          type: integer
          description: monthlyRemaining + topupBalance.
        renewalDate:
          type: string
          format: date-time
          description: When the monthly grant next resets (start of next UTC month).
      required:
        - plan
        - isGuest
        - monthlyGrant
        - monthlyRemaining
        - topupBalance
        - totalRemaining
        - renewalDate
    AdminTrendPoint:
      type: object
      properties:
        date:
          type: string
          description: A day ("YYYY-MM-DD") or month ("YYYY-MM") bucket.
        value:
          type: integer
      required:
        - date
        - value
    AdminPlanCount:
      type: object
      properties:
        plan:
          type: string
        count:
          type: integer
      required:
        - plan
        - count
    AdminOverview:
      type: object
      properties:
        totalUsers:
          type: integer
        newToday:
          type: integer
        new7d:
          type: integer
        new30d:
          type: integer
        registeredUsers:
          type: integer
        guestSubjects:
          type: integer
        planDistribution:
          type: array
          items:
            $ref: "#/components/schemas/AdminPlanCount"
        creditsConsumedThisMonth:
          type: integer
        signupTrend:
          type: array
          items:
            $ref: "#/components/schemas/AdminTrendPoint"
        copilotTrend:
          type: array
          items:
            $ref: "#/components/schemas/AdminTrendPoint"
      required:
        - totalUsers
        - newToday
        - new7d
        - new30d
        - registeredUsers
        - guestSubjects
        - planDistribution
        - creditsConsumedThisMonth
        - signupTrend
        - copilotTrend
    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: ["string", "null"]
        plan:
          type: string
        signupMethod:
          type: string
          enum:
            - google
            - password
        createdAt:
          type: string
          format: date-time
        creditsUsedThisMonth:
          type: integer
        monthlyGrant:
          type: integer
        topupBalance:
          type: integer
      required:
        - id
        - email
        - name
        - plan
        - signupMethod
        - createdAt
        - creditsUsedThisMonth
        - monthlyGrant
        - topupBalance
    AdminUserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required:
        - users
        - total
        - page
        - pageSize
    UpdateUserPlanInput:
      type: object
      properties:
        plan:
          type: string
          enum:
            - free
            - researcher
            - pioneer
      required:
        - plan
    GrantCreditsInput:
      type: object
      properties:
