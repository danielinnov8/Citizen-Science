openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: profiles
    description: Featured scientists & inventors directory
  - name: billing
    description: Credit balance and usage-based billing
  - name: admin
    description: Superadmin platform administration
  - name: citizenx
    description: CitizenX community program — chapters, events, and published experiments
  - name: mentorship
    description: Mentorship marketplace — mentor profiles, courses, and enrollments
  - name: challenges
    description: Humanity's Greatest Challenges hub — join challenges and submit solutions
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      description: Creates an account with email/password and starts a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      description: Verifies credentials and starts a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      description: Destroys the current session and clears the session cookie.
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated user
      description: Returns the user for the active session, or 401 if not signed in.
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/google:
    get:
      operationId: startGoogleAuth
      tags: [auth]
      summary: Start Google OAuth
      description: >
        Browser-redirect endpoint. Redirects the user to Google's consent
        screen (authorization-code flow with PKCE). Navigate to this URL
        directly via the browser; it is not a JSON/fetch endpoint.
      responses:
        "302":
          description: Redirect to Google's OAuth consent screen
  /auth/google/callback:
    get:
      operationId: googleAuthCallback
      tags: [auth]
      summary: Google OAuth callback
      description: >
        Browser-redirect endpoint. Google redirects back here with an
        authorization code; the server exchanges it, creates or links the
        user, starts a session, and redirects into the web app.
      responses:
        "302":
          description: Redirect back into the web app
  /profiles:
    get:
      operationId: listFeaturedProfiles
      tags: [profiles]
      summary: List featured scientists and inventors
      description: >
        Returns the directory of featured scientists and inventors as
        lightweight summaries (no contributions, quotes, or citations).
      responses:
        "200":
          description: The directory listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeaturedProfileSummary"
  /profiles/{slug}:
    get:
      operationId: getFeaturedProfile
      tags: [profiles]
      summary: Get a featured profile by slug
      description: Returns the full profile for a single scientist or inventor.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedProfile"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateMyProfile
      tags: [profiles]
      summary: Edit a profile you own
      description: >
        Owner-only (Task #92). Updates a sensible subset of the profile's
        editable content. The caller must be the profile's approved owner; any
        other authenticated user gets a 403. Only the provided fields change.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedProfile"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the owner of this profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /profiles/{slug}/claim:
    get:
      operationId: getMyProfileClaim
      tags: [profiles]
      summary: Get the current user's claim status for a profile
      description: >
        Login-gated (Task #92). Returns whether the profile is claimable (living
        innovator), whether the caller already owns it, and the status of the
        caller's own claim, if any.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The caller's claim status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileClaimStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: claimProfile
      tags: [profiles]
      summary: Submit a claim for a living innovator's profile
      description: >
        Login-gated (Task #92). Submits a claim to own this profile using the
        caller's own account email. Rejected when the profile is not a living
        innovator, is already owned, or the caller already has a pending/approved
        claim.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: The submitted claim status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileClaimStatus"
        "400":
          description: Profile is not claimable (not a living innovator)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already owned, or a claim already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /profiles/{slug}/solutions:
    get:
      operationId: listProfileSolutions
      tags: [profiles]
      summary: List all challenge solutions submitted by a directory profile
      description: >
        Public. Returns all challenge solutions where the author_slug matches
        the given profile slug, with the parent challenge's title, domain, and
        urgency included for linking and display.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Solutions submitted by this profile
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ProfileSolutionItem"
  /onboarding:
    get:
      operationId: getOnboardingState
      tags: [onboarding]
      summary: Get the current user's onboarding state
      description: >
        Auth required. Returns whether the user has completed the
        story-driven onboarding (server-side source of truth) and, when
        present, the saved structured record.
      responses:
        "200":
          description: The user's onboarding state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "401":
          description: Not authenticated
  /onboarding/complete:
    post:
      operationId: completeOnboarding
      tags: [onboarding]
      summary: Complete onboarding and persist answers
      description: >
        Auth required. Saves the member's onboarding answers (structured
        fields plus, when a free-form interview transcript is supplied,
        AI-extracted insights) and marks the account onboarded. Idempotent —
        repeat calls update the existing record. Not credit-metered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteOnboardingInput"
      responses:
        "200":
          description: Onboarding saved
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OnboardingState"
        "400":
          description: Invalid input
        "401":
          description: Not authenticated
  /billing/credits:
    get:
      operationId: getCreditBalance
      tags: [billing]
      summary: Get the current credit balance
      description: >
        Returns the credit balance for the caller — a signed-in user or, when
        logged out, the anonymous guest identified by the browser's anon cookie.
        Credits meter all AI features (copilot chat, web-grounded research,
        field-notes analysis, and the talking avatar).
      responses:
        "200":
          description: The caller's credit balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditBalance"
  /billing/economy:
    get:
      operationId: getCreditEconomy
      tags: [billing]
      summary: Get the credit economy blueprint
      description: >
        Public, read-only map of the platform's whole token/credit economy:
        every credit-consuming action and its cost, what each tier grants per
        month, and the placeholder top-up packs. All figures come from the
        server's credit definitions (single source of truth) so the /MCP
        reference page can't drift. The USD prices are the intended Stripe
        mapping only — no live checkout is wired up.
      responses:
        "200":
          description: The credit economy blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditEconomy"
  /billing/prices:
    get:
      operationId: getBillingPrices
      tags: [billing]
      summary: List available Stripe subscription and top-up prices
      description: >
        Public. Returns subscription plan prices and one-time top-up pack
        prices synced from Stripe. Returns empty arrays when the Stripe
        integration is not yet connected.
      responses:
        "200":
          description: Available prices
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BillingPrices"
  /billing/checkout:
    post:
      operationId: createCheckoutSession
      tags: [billing]
      summary: Create a Stripe checkout session
      description: >
        Auth required. Creates a Stripe Checkout session for a subscription
        plan or a one-time credit top-up pack. Returns a URL to redirect the
        user to Stripe's hosted checkout page.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutInput"
      responses:
        "200":
          description: Checkout session URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutUrl"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Stripe not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /billing/checkout-guest:
    post:
      operationId: createGuestCheckoutSession
      tags: [billing]
      summary: Create a guest Stripe checkout session (founding member)
      description: >
        Public — no account required. Creates a Stripe Checkout session for a
        one-time founding membership; Stripe collects the buyer's email during
        checkout. After payment, the webhook records the purchase and the
        buyer claims it by signing in or creating an account with the same
        email. Only prices tagged as founding memberships are accepted —
        subscriptions and top-ups still require an authenticated checkout.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateCheckoutInput"
      responses:
        "200":
          description: Checkout session URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutUrl"
        "400":
          description: Invalid input or not a founding price
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "429":
          description: Rate limited
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Stripe not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /billing/checkout-session/{sessionId}:
    get:
      operationId: getCheckoutSession
      tags: [billing]
      summary: Look up a completed guest checkout session
      description: >
        Public. Returns the buyer email and claim state for a PAID
        founding-member checkout session so the post-payment page can route
        the buyer to sign-in (email matches an account) or sign-up (no
        account yet). Session IDs are unguessable, so possessing one is proof
        enough for this read-only lookup.
      parameters:
        - name: sessionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Checkout session info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CheckoutSessionInfo"
        "404":
          description: Unknown or unpaid session
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Stripe not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /billing/portal:
    post:
      operationId: createPortalSession
      tags: [billing]
      summary: Create a Stripe customer portal session
      description: >
        Auth required. Creates a Stripe Billing Portal session so the user
        can manage their subscription, update their payment method, or cancel.
        Returns a URL to redirect the user to.
      responses:
        "200":
          description: Portal session URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PortalUrl"
        "400":
          description: No billing account found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Stripe not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Admin overview KPIs
      description: Superadmin-only. Headline platform metrics and trend sparklines.
      responses:
        "200":
          description: Overview metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all accounts (searchable, paginated)
      description: Superadmin-only. Paginated, searchable list of accounts with per-user usage.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}/plan:
    patch:
      operationId: updateUserPlan
      tags: [admin]
      summary: Change a user's plan
      description: Superadmin-only. Sets the subscription plan for an account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPlanInput"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}/credits:
    post:
      operationId: grantUserCredits
      tags: [admin]
      summary: Grant top-up credits to a user
      description: Superadmin-only. Adds non-expiring top-up credits to an account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantCreditsInput"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}/mentor:
    patch:
      operationId: setUserMentor
      tags: [admin]
      summary: Flag or unflag a user as a mentor
      description: Superadmin-only. Toggles whether an account is a mentor.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserMentorInput"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/outreach/prospects:
    get:
      operationId: listOutreachProspects
      tags: [admin]
      summary: List outreach prospects
      description: Superadmin-only. Paginated, searchable, filterable prospect list.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: type
          in: query
          required: false
          schema:
            type: string
        - name: status
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated prospect list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachProspectList"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createOutreachProspect
      tags: [admin]
      summary: Add a prospect
      description: Superadmin-only. Adds a single prospect.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutreachProspectInput"
      responses:
        "201":
          description: The created prospect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachProspect"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/outreach/prospects/bulk:
    post:
      operationId: bulkImportOutreachProspects
      tags: [admin]
      summary: Bulk import prospects via CSV
      description: Superadmin-only. Imports prospects from CSV text (name,email,type,notes rows).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BulkImportProspectsInput"
      responses:
        "200":
          description: Import results
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BulkImportResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/outreach/prospects/{id}:
    patch:
      operationId: updateOutreachProspect
      tags: [admin]
      summary: Edit a prospect
      description: Superadmin-only. Updates prospect fields or marks as unsubscribed.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OutreachProspectPatch"
      responses:
        "200":
          description: The updated prospect
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutreachProspect"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteOutreachProspect
      tags: [admin]
      summary: Delete a prospect
      description: Superadmin-only. Permanently removes a prospect and their send history.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/outreach/queue-directory:
    post:
      operationId: queueDirectoryProspects
      tags: [admin]
      summary: Queue living directory figures as prospects
      description: >-
        Superadmin-only. Enumerates every featured directory profile and queues
        each LIVING figure as a directory-sourced prospect in the needs_review
        state (no email yet). Deceased figures are never queued. Idempotent.
      responses:
        "200":
          description: Queue result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QueueDirectoryResult"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/outreach/research-contacts:
    post:
      operationId: researchProspectContacts
      tags: [admin]
