openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication operations
  - name: profiles
    description: Featured scientists & inventors directory
  - name: billing
    description: Credit balance and usage-based billing
  - name: admin
    description: Superadmin platform administration
  - name: citizenx
    description: CitizenX community program — chapters, events, and published experiments
  - name: mentorship
    description: Mentorship marketplace — mentor profiles, courses, and enrollments
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new account
      description: Creates an account with email/password and starts a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      description: Verifies credentials and starts a session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out
      description: Destroys the current session and clears the session cookie.
      responses:
        "200":
          description: Logged out
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the current authenticated user
      description: Returns the user for the active session, or 401 if not signed in.
      responses:
        "200":
          description: The current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/google:
    get:
      operationId: startGoogleAuth
      tags: [auth]
      summary: Start Google OAuth
      description: >
        Browser-redirect endpoint. Redirects the user to Google's consent
        screen (authorization-code flow with PKCE). Navigate to this URL
        directly via the browser; it is not a JSON/fetch endpoint.
      responses:
        "302":
          description: Redirect to Google's OAuth consent screen
  /auth/google/callback:
    get:
      operationId: googleAuthCallback
      tags: [auth]
      summary: Google OAuth callback
      description: >
        Browser-redirect endpoint. Google redirects back here with an
        authorization code; the server exchanges it, creates or links the
        user, starts a session, and redirects into the web app.
      responses:
        "302":
          description: Redirect back into the web app
  /profiles:
    get:
      operationId: listFeaturedProfiles
      tags: [profiles]
      summary: List featured scientists and inventors
      description: >
        Returns the directory of featured scientists and inventors as
        lightweight summaries (no contributions, quotes, or citations).
      responses:
        "200":
          description: The directory listing
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeaturedProfileSummary"
  /profiles/{slug}:
    get:
      operationId: getFeaturedProfile
      tags: [profiles]
      summary: Get a featured profile by slug
      description: Returns the full profile for a single scientist or inventor.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedProfile"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateMyProfile
      tags: [profiles]
      summary: Edit a profile you own
      description: >
        Owner-only (Task #92). Updates a sensible subset of the profile's
        editable content. The caller must be the profile's approved owner; any
        other authenticated user gets a 403. Only the provided fields change.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateProfileInput"
      responses:
        "200":
          description: The updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeaturedProfile"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not the owner of this profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /profiles/{slug}/claim:
    get:
      operationId: getMyProfileClaim
      tags: [profiles]
      summary: Get the current user's claim status for a profile
      description: >
        Login-gated (Task #92). Returns whether the profile is claimable (living
        innovator), whether the caller already owns it, and the status of the
        caller's own claim, if any.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The caller's claim status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileClaimStatus"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: claimProfile
      tags: [profiles]
      summary: Submit a claim for a living innovator's profile
      description: >
        Login-gated (Task #92). Submits a claim to own this profile using the
        caller's own account email. Rejected when the profile is not a living
        innovator, is already owned, or the caller already has a pending/approved
        claim.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "201":
          description: The submitted claim status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MyProfileClaimStatus"
        "400":
          description: Profile is not claimable (not a living innovator)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Profile not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already owned, or a claim already exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /billing/credits:
    get:
      operationId: getCreditBalance
      tags: [billing]
      summary: Get the current credit balance
      description: >
        Returns the credit balance for the caller — a signed-in user or, when
        logged out, the anonymous guest identified by the browser's anon cookie.
        Credits meter all AI features (copilot chat, web-grounded research,
        field-notes analysis, and the talking avatar).
      responses:
        "200":
          description: The caller's credit balance
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditBalance"
  /billing/economy:
    get:
      operationId: getCreditEconomy
      tags: [billing]
      summary: Get the credit economy blueprint
      description: >
        Public, read-only map of the platform's whole token/credit economy:
        every credit-consuming action and its cost, what each tier grants per
        month, and the placeholder top-up packs. All figures come from the
        server's credit definitions (single source of truth) so the /MCP
        reference page can't drift. The USD prices are the intended Stripe
        mapping only — no live checkout is wired up.
      responses:
        "200":
          description: The credit economy blueprint
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreditEconomy"
  /admin/overview:
    get:
      operationId: getAdminOverview
      tags: [admin]
      summary: Admin overview KPIs
      description: Superadmin-only. Headline platform metrics and trend sparklines.
      responses:
        "200":
          description: Overview metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminOverview"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users:
    get:
      operationId: listAdminUsers
      tags: [admin]
      summary: List all accounts (searchable, paginated)
      description: Superadmin-only. Paginated, searchable list of accounts with per-user usage.
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        "200":
          description: Paginated user list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUserList"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}/plan:
    patch:
      operationId: updateUserPlan
      tags: [admin]
      summary: Change a user's plan
      description: Superadmin-only. Sets the subscription plan for an account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserPlanInput"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}/credits:
    post:
      operationId: grantUserCredits
      tags: [admin]
      summary: Grant top-up credits to a user
      description: Superadmin-only. Adds non-expiring top-up credits to an account.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantCreditsInput"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/users/{id}/mentor:
    patch:
      operationId: setUserMentor
      tags: [admin]
      summary: Flag or unflag a user as a mentor
      description: Superadmin-only. Toggles whether an account is a mentor.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetUserMentorInput"
      responses:
        "200":
          description: The updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUser"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mentors:
    get:
      operationId: listMentors
      tags: [mentorship]
      summary: List public mentors
      description: >
        Public. Returns mentors who have a profile and at least one published
        course, as lightweight cards.
      responses:
        "200":
          description: Mentor directory
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MentorSummary"
  /mentors/{id}:
    get:
      operationId: getMentor
      tags: [mentorship]
      summary: Get a mentor and their published courses
      description: Public. Returns a mentor's profile plus their published courses.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The mentor detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorDetail"
        "404":
          description: Mentor not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mentorship/me:
    get:
      operationId: getMyMentorWorkspace
      tags: [mentorship]
      summary: Get the current mentor's profile, courses, and mentees
      description: >
        Mentor-only. Returns the signed-in mentor's profile (created lazily if
        missing), all of their courses (including unpublished), and their
        mentees' enrollments.
      responses:
        "200":
          description: The mentor workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorWorkspace"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "403":
          description: Not a mentor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mentorship/me/profile:
    put:
      operationId: updateMyMentorProfile
      tags: [mentorship]
      summary: Update the current mentor's profile
      description: Mentor-only. Sets headline, bio, and expertise tags.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MentorProfileInput"
      responses:
        "200":
          description: The updated mentor workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorWorkspace"
        "403":
          description: Not a mentor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mentorship/me/courses:
    post:
      operationId: createMyCourse
      tags: [mentorship]
      summary: Create a mentoring course
      description: Mentor-only. Creates a new course owned by the signed-in mentor.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "201":
          description: The created course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorCourse"
        "403":
          description: Not a mentor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mentorship/me/courses/{courseId}:
    patch:
      operationId: updateMyCourse
      tags: [mentorship]
      summary: Update a mentoring course
      description: Mentor-only. Updates a course owned by the signed-in mentor.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseInput"
      responses:
        "200":
          description: The updated course
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MentorCourse"
        "403":
          description: Not a mentor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Course not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteMyCourse
      tags: [mentorship]
      summary: Delete a mentoring course
      description: Mentor-only. Deletes a course owned by the signed-in mentor.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "403":
          description: Not a mentor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Course not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mentorship/me/courses/draft:
    post:
      operationId: draftMyCourse
      tags: [mentorship]
      summary: AI-draft a mentoring course from a brief
      description: >
        Mentor-only. Uses Gemini to draft a course (title, description, learning
        outcomes) from a free-form brief. Credit-metered.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CourseDraftInput"
      responses:
        "200":
          description: The drafted course fields
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CourseDraft"
        "402":
          description: Out of credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutOfCreditsError"
        "403":
          description: Not a mentor
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: AI drafting unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mentorship/enrollments:
    get:
      operationId: getMyEnrollments
      tags: [mentorship]
      summary: List the current member's enrollments
      description: Auth-only. Returns the courses the signed-in member is enrolled in.
      responses:
        "200":
          description: The member's enrollments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/EnrolledCourse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /mentorship/courses/{courseId}/enroll:
    post:
      operationId: enrollInCourse
      tags: [mentorship]
      summary: Enroll in a mentoring course
      description: >
        Auth-only. Enrolls the signed-in member as a mentee, paying the given
        credits (at least the course minimum). Credits are deducted from the
        mentee and credited to the mentor via the credit ledger.
      parameters:
        - name: courseId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnrollInput"
      responses:
        "200":
          description: The created enrollment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EnrollResult"
        "400":
          description: Invalid input (e.g. below the minimum, or own course)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "402":
          description: Out of credits
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OutOfCreditsError"
        "404":
          description: Course not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Already enrolled
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/revenue:
    get:
      operationId: getAdminRevenue
      tags: [admin]
      summary: Projected revenue
      description: Superadmin-only. Projected MRR from plan tiers (no live payment processor).
      responses:
        "200":
          description: Revenue projection
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminRevenue"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/usage:
    get:
      operationId: getAdminUsage
      tags: [admin]
      summary: AI usage aggregates
      description: Superadmin-only. AI consumption over time plus live avatar session count.
      responses:
        "200":
          description: Usage aggregates
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminUsage"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/content:
    get:
      operationId: getAdminContent
      tags: [admin]
      summary: Content & module counts
      description: Superadmin-only. Counts of categories, profiles, partners and labs.
      responses:
        "200":
          description: Content counts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminContent"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/system:
    get:
      operationId: getAdminSystem
      tags: [admin]
      summary: Feature & integration status board
      description: >
        Superadmin-only. Whether each integration is configured (booleans only,
        never the secret values) plus API health.
      responses:
        "200":
          description: System status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminSystem"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/chapters:
    get:
      operationId: listCitizenxChapters
      tags: [citizenx]
      summary: List active CitizenX chapters
      description: Public list of active (approved) CitizenX chapters.
      responses:
        "200":
          description: Active chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenxChapter"
    post:
      operationId: applyCitizenxChapter
      tags: [citizenx]
      summary: Apply to organize a CitizenX chapter
      description: Authenticated. Submits a chapter application in "pending" status.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenxChapterInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenxChapter"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/chapters/mine:
    get:
      operationId: listMyCitizenxChapters
      tags: [citizenx]
      summary: List my CitizenX chapter applications
      description: Authenticated. The caller's own chapters, including pending ones.
      responses:
        "200":
          description: The caller's chapters
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenxChapter"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/events:
    get:
      operationId: listCitizenxEvents
      tags: [citizenx]
      summary: List upcoming CitizenX events
      description: Public list of upcoming CitizenX events, soonest first.
      responses:
        "200":
          description: Upcoming events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenxEvent"
    post:
      operationId: createCitizenxEvent
      tags: [citizenx]
      summary: Host a CitizenX event
      description: Authenticated. Creates a publicly listed upcoming event.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenxEventInput"
      responses:
        "201":
          description: Event created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenxEvent"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/events/mine:
    get:
      operationId: listMyCitizenxEvents
      tags: [citizenx]
      summary: List my CitizenX events
      description: Authenticated. Events hosted by the caller.
      responses:
        "200":
          description: The caller's events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenxEvent"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/events/{slug}:
    get:
      operationId: getCitizenxEvent
      tags: [citizenx]
      summary: Get a CitizenX event by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The event
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenxEvent"
        "404":
          description: Event not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/experiments:
    get:
      operationId: listCitizenxExperiments
      tags: [citizenx]
      summary: List published CitizenX experiments
      description: Public gallery of member-published experiments, newest first.
      responses:
        "200":
          description: Published experiments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenxExperimentSummary"
    post:
      operationId: publishCitizenxExperiment
      tags: [citizenx]
      summary: Publish a CitizenX experiment
      description: Authenticated. Publishes a shareable experiment authored by the caller.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CitizenxExperimentInput"
      responses:
        "201":
          description: Experiment published
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenxExperiment"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/experiments/mine:
    get:
      operationId: listMyCitizenxExperiments
      tags: [citizenx]
      summary: List my published CitizenX experiments
      description: Authenticated. Experiments published by the caller.
      responses:
        "200":
          description: The caller's experiments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenxExperimentSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/experiments/{slug}:
    get:
      operationId: getCitizenxExperiment
      tags: [citizenx]
      summary: Get a published CitizenX experiment by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenxExperiment"
        "404":
          description: Experiment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/claims:
    get:
      operationId: listAdminClaims
      tags: [admin]
      summary: List profile-ownership claims
      description: >
        Superadmin-only (Task #92). Lists profile claims with claimant and
        profile details, newest first, optionally filtered by status.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProfileClaimStatus"
      responses:
        "200":
          description: The claims list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClaimList"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/claims/{id}/approve:
    post:
      operationId: approveClaim
      tags: [admin]
      summary: Approve a profile claim
      description: >
        Superadmin-only (Task #92). Approves the claim, sets the profile's owner
        (granting a Verified badge + edit rights), and denies any other pending
        claims on the same profile.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The updated claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClaim"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/claims/{id}/deny:
    post:
      operationId: denyClaim
      tags: [admin]
      summary: Deny a profile claim
      description: Superadmin-only (Task #92). Marks the claim as denied.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The updated claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClaim"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List the signed-in member's received messages
      description: >
        Returns messages received by the current member, newest first, plus the
        unread count for the inbox badge. Requires authentication.
      responses:
        "200":
          description: The inbox listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a direct message to another member
      description: >
        Sends a message to a member account (by id) or to the verified owner of
        a featured directory profile (by slug). Provide exactly one of
        recipientId or profileSlug. Requires authentication; cannot message
        yourself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Recipient not found or profile has no owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /messages/{id}/read:
    post:
      operationId: markMessageRead
      tags: [messages]
      summary: Mark a received message as read
      description: >
        Marks a message as read for the current member (recipient only). Requires
        authentication.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
        held:
          type: boolean
          description: >
            True when the message was held for an unclaimed living member and
            will be delivered once they claim their profile.
      required:
        - success
    Message:
      type: object
      properties:
        id:
          type: string
        senderId:
          type: string
        senderName:
          type: ["string", "null"]
        senderEmail:
          type: string
        subject:
          type: ["string", "null"]
        body:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - senderId
        - senderName
        - senderEmail
        - subject
        - body
        - read
        - createdAt
    MessageList:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        unreadCount:
          type: integer
      required:
        - messages
        - unreadCount
    SendMessageInput:
      type: object
      properties:
        recipientId:
          type: string
          description: Target member account id. Provide this OR profileSlug.
        profileSlug:
          type: string
          description: Target directory profile slug (routes to its owner). Provide this OR recipientId.
        subject:
          type: string
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 5000
      required:
        - body
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: ["string", "null"]
        image:
          type: ["string", "null"]
        isSuperAdmin:
          type: boolean
          description: Whether this account is a platform superadmin (admin portal access).
        isMentor:
          type: boolean
          description: Whether this account is flagged as a mentor (can publish mentoring courses).
      required:
        - id
        - email
        - name
        - image
        - isSuperAdmin
        - isMentor
    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 3
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
      required:
        - email
        - password
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    ProfileSource:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
      required:
        - title
        - url
    ProfilePatent:
      type: object
      properties:
        title:
          type: string
        number:
          type: string
        year:
          type: string
        url:
          type: string
      required:
        - title
        - number
        - url
    ProfileGroup:
      type: string
      enum:
        - scientist
        - inventor
        - thought_leader
    ProfileTimelineEntry:
      type: object
      properties:
        year:
          type: string
        title:
          type: string
        detail:
          type: string
      required:
        - year
        - title
        - detail
    ProfileStoryContribution:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
      required:
        - title
        - detail
    ProfileStoryTheme:
      type: object
      properties:
        accent:
          type: string
        accentSoft:
          type: string
        accentDeep:
          type: string
        heroFrom:
          type: string
        heroTo:
          type: string
        motif:
          type: string
        heroVariant:
          type: string
      required:
        - accent
        - accentSoft
        - accentDeep
        - heroFrom
        - heroTo
        - motif
    FeaturedProfileSummary:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        group:
          $ref: "#/components/schemas/ProfileGroup"
        field:
          type: string
        era:
          type: string
        imageUrl:
          type: ["string", "null"]
      required:
        - id
        - slug
        - name
        - group
        - field
        - era
        - imageUrl
    FeaturedProfile:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        group:
          $ref: "#/components/schemas/ProfileGroup"
        field:
          type: string
        era:
          type: string
        summary:
          type: string
        contributions:
          type: array
          items:
            type: string
        quotes:
          type: array
          items:
            type: string
        imageUrl:
          type: ["string", "null"]
        relatedCategorySlugs:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSource"
        patents:
          type: array
          items:
            $ref: "#/components/schemas/ProfilePatent"
        tagline:
          type: ["string", "null"]
        lifespan:
          type: ["string", "null"]
        birthplace:
          type: ["string", "null"]
        biography:
          type: array
          items:
            type: string
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/ProfileTimelineEntry"
        storyContributions:
          type: array
          items:
            $ref: "#/components/schemas/ProfileStoryContribution"
        legacy:
          type: array
          items:
            type: string
        didYouKnow:
          type: array
          items:
            type: string
        storyTheme:
          anyOf:
            - $ref: "#/components/schemas/ProfileStoryTheme"
            - type: "null"
        verified:
          type: boolean
          description: >
            Whether this profile has an approved owner (Task #92). True once a
            superadmin approves a user's claim; drives the "Verified" badge.
      required:
        - id
        - slug
        - name
        - group
        - field
        - era
        - summary
        - contributions
        - quotes
        - imageUrl
        - relatedCategorySlugs
        - sources
        - patents
        - tagline
        - lifespan
        - birthplace
        - biography
        - timeline
        - storyContributions
        - legacy
        - didYouKnow
        - storyTheme
        - verified
    ProfileClaimStatus:
      type: string
      enum:
        - pending
        - approved
        - denied
    MyProfileClaimStatus:
      type: object
      description: The current user's claim relationship to a profile (Task #92).
      properties:
        claimable:
          type: boolean
          description: Whether this profile is a living innovator and can be claimed.
        isOwner:
          type: boolean
          description: Whether the current user is the approved owner of this profile.
        email:
          type: string
          description: The current user's account email (used to submit a claim).
        claim:
          anyOf:
            - $ref: "#/components/schemas/ProfileClaimState"
            - type: "null"
          description: The current user's own claim for this profile, if any.
      required:
        - claimable
        - isOwner
        - email
        - claim
    ProfileClaimState:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/ProfileClaimStatus"
        email:
          type: string
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - status
        - email
        - createdAt
        - reviewedAt
    AdminClaim:
      type: object
      properties:
        id:
          type: string
        status:
          $ref: "#/components/schemas/ProfileClaimStatus"
        email:
          type: string
          description: The account email the claim was submitted with.
        profileSlug:
          type: string
        profileName:
          type: string
        claimantId:
          type: string
        claimantName:
          type: ["string", "null"]
        claimantEmail:
          type: string
        createdAt:
          type: string
          format: date-time
        reviewedAt:
          type: ["string", "null"]
          format: date-time
      required:
        - id
        - status
        - email
        - profileSlug
        - profileName
        - claimantId
        - claimantName
        - claimantEmail
        - createdAt
        - reviewedAt
    AdminClaimList:
      type: object
      properties:
        claims:
          type: array
          items:
            $ref: "#/components/schemas/AdminClaim"
        total:
          type: integer
      required:
        - claims
        - total
    UpdateProfileInput:
      type: object
      description: >
        Owner-editable profile fields (Task #92). All optional; only provided
        fields are updated.
      properties:
        summary:
          type: string
        tagline:
          type: ["string", "null"]
        field:
          type: string
        era:
          type: string
        birthplace:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        biography:
          type: array
          items:
            type: string
        contributions:
          type: array
          items:
            type: string
        quotes:
          type: array
          items:
            type: string
    CreditBalance:
      type: object
      properties:
        plan:
          type: string
          description: The plan id ("free", "researcher", "pioneer") or "guest".
        isGuest:
          type: boolean
        monthlyGrant:
          type: integer
          description: Credits granted per month for this plan.
        monthlyRemaining:
          type: integer
          description: Credits left from this month's grant.
        topupBalance:
          type: integer
          description: Non-expiring top-up credits remaining.
        totalRemaining:
          type: integer
          description: monthlyRemaining + topupBalance.
        renewalDate:
          type: string
          format: date-time
          description: When the monthly grant next resets (start of next UTC month).
      required:
        - plan
        - isGuest
        - monthlyGrant
        - monthlyRemaining
        - topupBalance
        - totalRemaining
        - renewalDate
    CreditAction:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        credits:
          type: integer
          description: Credit cost for this action.
        metered:
          type: boolean
          description: >
            True when token-metered (≈1 credit / 1,000 tokens) and `credits`
            is the fixed fallback estimate; false for fixed-price actions.
      required:
        - id
        - label
        - description
        - credits
        - metered
    CreditTier:
      type: object
      properties:
        id:
          type: string
          description: '"guest", "free", "researcher", or "pioneer".'
        name:
          type: string
        monthlyCredits:
          type: integer
          description: Credits granted each month.
        monthlyUsd:
          type: number
          description: Planned monthly price in USD (Stripe mapping, not live).
        isGuest:
          type: boolean
      required:
        - id
        - name
        - monthlyCredits
        - monthlyUsd
        - isGuest
    CreditTopupPack:
      type: object
      properties:
        id:
          type: string
        credits:
          type: integer
        usd:
          type: number
          description: Planned price in USD (Stripe mapping, not live).
        popular:
          type: boolean
      required:
        - id
        - credits
        - usd
    CreditEconomy:
      type: object
      description: >
        Blueprint of the platform's whole token/credit economy. All figures
        derive from the server's credit definitions (single source of truth).
      properties:
        tokensPerCredit:
          type: integer
          description: Roughly one credit per this many AI tokens.
        actions:
          type: array
          items:
            $ref: "#/components/schemas/CreditAction"
        tiers:
          type: array
          items:
            $ref: "#/components/schemas/CreditTier"
        topups:
          type: array
          items:
            $ref: "#/components/schemas/CreditTopupPack"
      required:
        - tokensPerCredit
        - actions
        - tiers
        - topups
    AdminTrendPoint:
      type: object
      properties:
        date:
          type: string
          description: A day ("YYYY-MM-DD") or month ("YYYY-MM") bucket.
        value:
          type: integer
      required:
        - date
        - value
    AdminPlanCount:
      type: object
      properties:
        plan:
          type: string
        count:
          type: integer
      required:
        - plan
        - count
    AdminOverview:
      type: object
      properties:
        totalUsers:
          type: integer
        newToday:
          type: integer
        new7d:
          type: integer
        new30d:
          type: integer
        registeredUsers:
          type: integer
        guestSubjects:
          type: integer
        planDistribution:
          type: array
          items:
            $ref: "#/components/schemas/AdminPlanCount"
        creditsConsumedThisMonth:
          type: integer
        signupTrend:
          type: array
          items:
            $ref: "#/components/schemas/AdminTrendPoint"
        copilotTrend:
          type: array
          items:
            $ref: "#/components/schemas/AdminTrendPoint"
      required:
        - totalUsers
        - newToday
        - new7d
        - new30d
        - registeredUsers
        - guestSubjects
        - planDistribution
        - creditsConsumedThisMonth
        - signupTrend
        - copilotTrend
    AdminUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: ["string", "null"]
        plan:
          type: string
        signupMethod:
          type: string
          enum:
            - google
            - password
        createdAt:
          type: string
          format: date-time
        creditsUsedThisMonth:
          type: integer
        monthlyGrant:
          type: integer
        topupBalance:
          type: integer
        isMentor:
          type: boolean
          description: Whether this account is flagged as a mentor.
      required:
        - id
        - email
        - name
        - plan
        - signupMethod
        - createdAt
        - creditsUsedThisMonth
        - monthlyGrant
        - topupBalance
        - isMentor
    AdminUserList:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: "#/components/schemas/AdminUser"
        total:
          type: integer
        page:
          type: integer
        pageSize:
          type: integer
      required:
        - users
        - total
        - page
        - pageSize
    UpdateUserPlanInput:
      type: object
      properties:
        plan:
          type: string
          enum:
            - free
            - researcher
            - pioneer
      required:
        - plan
    GrantCreditsInput:
      type: object
      properties:
        credits:
          type: integer
          minimum: 1
      required:
        - credits
    SetUserMentorInput:
      type: object
      properties:
        isMentor:
          type: boolean
      required:
        - isMentor
    OutOfCreditsError:
      type: object
      properties:
        error:
          type: string
        outOfCredits:
          type: boolean
        isGuest:
          type: boolean
        upgradeHref:
          type: string
      required:
        - error
        - outOfCredits
    MentorCourse:
      type: object
      properties:
        id:
          type: string
        mentorUserId:
          type: string
        title:
          type: string
        description:
          type: string
        outcomes:
          type: array
          items:
            type: string
        creditPrice:
          type: integer
        minCredits:
          type: integer
        published:
          type: boolean
        enrollmentCount:
          type: integer
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - mentorUserId
        - title
        - description
        - outcomes
        - creditPrice
        - minCredits
        - published
        - enrollmentCount
        - createdAt
    MentorSummary:
      type: object
      properties:
        userId:
          type: string
        name:
          type: ["string", "null"]
        image:
          type: ["string", "null"]
        headline:
          type: string
        expertise:
          type: array
          items:
            type: string
        courseCount:
