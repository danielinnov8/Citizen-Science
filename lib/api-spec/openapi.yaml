              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/experiments/mine:
    get:
      operationId: listMyCitizenxExperiments
      tags: [citizenx]
      summary: List my published CitizenX experiments
      description: Authenticated. Experiments published by the caller.
      responses:
        "200":
          description: The caller's experiments
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CitizenxExperimentSummary"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /citizenx/experiments/{slug}:
    get:
      operationId: getCitizenxExperiment
      tags: [citizenx]
      summary: Get a published CitizenX experiment by slug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The experiment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CitizenxExperiment"
        "404":
          description: Experiment not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/claims:
    get:
      operationId: listAdminClaims
      tags: [admin]
      summary: List profile-ownership claims
      description: >
        Superadmin-only (Task #92). Lists profile claims with claimant and
        profile details, newest first, optionally filtered by status.
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ProfileClaimStatus"
      responses:
        "200":
          description: The claims list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClaimList"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/claims/{id}/approve:
    post:
      operationId: approveClaim
      tags: [admin]
      summary: Approve a profile claim
      description: >
        Superadmin-only (Task #92). Approves the claim, sets the profile's owner
        (granting a Verified badge + edit rights), and denies any other pending
        claims on the same profile.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The updated claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClaim"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admin/claims/{id}/deny:
    post:
      operationId: denyClaim
      tags: [admin]
      summary: Deny a profile claim
      description: Superadmin-only (Task #92). Marks the claim as denied.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The updated claim
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdminClaim"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Claim not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /messages:
    get:
      operationId: listMessages
      tags: [messages]
      summary: List the signed-in member's received messages
      description: >
        Returns messages received by the current member, newest first, plus the
        unread count for the inbox badge. Requires authentication.
      responses:
        "200":
          description: The inbox listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageList"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: sendMessage
      tags: [messages]
      summary: Send a direct message to another member
      description: >
        Sends a message to a member account (by id) or to the verified owner of
        a featured directory profile (by slug). Provide exactly one of
        recipientId or profileSlug. Requires authentication; cannot message
        yourself.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SendMessageInput"
      responses:
        "201":
          description: Message sent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Recipient not found or profile has no owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /messages/{id}/read:
    post:
      operationId: markMessageRead
      tags: [messages]
      summary: Mark a received message as read
      description: >
        Marks a message as read for the current member (recipient only). Requires
        authentication.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /challenges:
    get:
      operationId: listChallenges
      tags: [challenges]
      summary: List humanity's greatest challenges
      description: >
        Public. Returns all 25 curated challenges with their joiner count.
      responses:
        "200":
          description: List of challenges
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeSummary"
  /challenges/{slug}:
    get:
      operationId: getChallenge
      tags: [challenges]
      summary: Get a challenge by slug
      description: >
        Public. Returns full challenge detail including teams and joiner count.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The challenge
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeDetail"
        "404":
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /challenges/{slug}/join:
    post:
      operationId: joinChallenge
      tags: [challenges]
      summary: Join or leave a challenge
      description: >
        Auth required. Idempotent toggle — if already joined, leaves; otherwise joins.
        Returns the new joined state and the updated member count.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Join/leave result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JoinChallengeResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /challenges/{slug}/solutions:
    get:
      operationId: listChallengeSolutions
      tags: [challenges]
      summary: List community solutions for a challenge
      description: >
        Public. Returns submitted solution proposals for the given challenge,
        newest first.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: List of solutions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChallengeSolutionView"
        "404":
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createChallengeSolution
      tags: [challenges]
      summary: Submit a solution proposal
      description: >
        Auth required. Submits a solution proposal for the given challenge.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateChallengeSolutionInput"
      responses:
        "201":
          description: Solution submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeSolutionView"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Challenge not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /challenges/{slug}/solutions/{solutionId}:
    get:
      operationId: getChallengeSolution
      tags: [challenges]
      summary: Get a single solution with parent challenge context
      description: >
        Public. Returns the solution fields plus the parent challenge title,
        summary, whyItMatters, domain, urgency, and imageUrl so the solution
        detail page can present the problem before the answer.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: solutionId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Solution with challenge context
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChallengeSolutionDetail"
        "404":
          description: Solution not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /challenges/{slug}/solutions/{solutionId}/vote:
    post:
      operationId: voteSolution
      tags: [challenges]
      summary: Upvote or downvote a solution
      description: >
        Auth required. Casts a vote (1 = upvote, -1 = downvote) on a solution.
        Sending the same direction again removes the vote (toggle). Sending 0
        explicitly removes any existing vote.
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
        - name: solutionId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VoteSolutionInput"
      responses:
        "200":
          description: Updated vote totals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VoteSolutionResult"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Solution not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    ChallengeTeam:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        url:
          type: string
      required:
        - name
        - description
        - url
    ChallengeSummary:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        domain:
          type: string
        urgency:
          type: string
        summary:
          type: string
        imageUrl:
          type: ["string", "null"]
        memberCount:
          type: integer
        isJoined:
          type: boolean
      required:
        - slug
        - title
        - domain
        - urgency
        - summary
        - imageUrl
        - memberCount
        - isJoined
    ChallengeDetail:
      type: object
      properties:
        slug:
          type: string
        title:
          type: string
        domain:
          type: string
        urgency:
          type: string
        summary:
          type: string
        whyItMatters:
          type: string
        imageUrl:
          type: ["string", "null"]
        teams:
          type: array
          items:
            $ref: "#/components/schemas/ChallengeTeam"
        memberCount:
          type: integer
        isJoined:
          type: boolean
      required:
        - slug
        - title
        - domain
        - urgency
        - summary
        - whyItMatters
        - imageUrl
        - teams
        - memberCount
        - isJoined
    JoinChallengeResult:
      type: object
      properties:
        joined:
          type: boolean
        count:
          type: integer
      required:
        - joined
        - count
    ProfileSolutionItem:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        approach:
          type: string
        link:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        voteScore:
          type: integer
          description: Net vote score (upvotes minus downvotes)
        challengeSlug:
          type: string
        challengeTitle:
          type: string
        challengeDomain:
          type: string
        challengeUrgency:
          type: string
      required:
        - id
        - title
        - description
        - approach
        - link
        - createdAt
        - voteScore
        - challengeSlug
        - challengeTitle
        - challengeDomain
        - challengeUrgency
    ChallengeSolutionDetail:
      type: object
      properties:
        id:
          type: string
        title:
          type: string
        description:
          type: string
        approach:
          type: string
        link:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        voteScore:
          type: integer
        userVote:
          type: ["integer", "null"]
        authorName:
          type: string
        authorSlug:
          type: ["string", "null"]
        authorNobelPrizes:
          type: array
          description: Nobel prizes won by the author when they map to a featured profile; empty when the author is not a laureate.
          items:
            $ref: "#/components/schemas/ProfileNobelPrize"
        challengeSlug:
          type: string
        challengeTitle:
          type: string
        challengeSummary:
          type: string
        challengeWhyItMatters:
          type: string
        challengeDomain:
          type: string
        challengeUrgency:
          type: string
        challengeImageUrl:
          type: ["string", "null"]
      required:
        - id
        - title
        - description
        - approach
        - link
        - createdAt
        - voteScore
        - userVote
        - authorName
        - authorSlug
        - authorNobelPrizes
        - challengeSlug
        - challengeTitle
        - challengeSummary
        - challengeWhyItMatters
        - challengeDomain
        - challengeUrgency
        - challengeImageUrl
    ChallengeSolutionView:
      type: object
      properties:
        id:
          type: string
        challengeSlug:
          type: string
        userId:
          type: ["string", "null"]
        authorName:
          type: string
        authorSlug:
          type: ["string", "null"]
        authorImageUrl:
          type: ["string", "null"]
          description: Author's directory profile picture, when the author maps to a featured profile
        authorNobelPrizes:
          type: array
          description: Nobel prizes won by the author when they map to a featured profile; empty when the author is not a laureate.
          items:
            $ref: "#/components/schemas/ProfileNobelPrize"
        title:
          type: string
        description:
          type: string
        approach:
          type: string
        link:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
        voteScore:
          type: integer
          description: Net vote score (upvotes minus downvotes)
        userVote:
          type: ["integer", "null"]
          description: The current user's vote direction (1, -1) or null if not voted
      required:
        - id
        - challengeSlug
        - userId
        - authorName
        - authorSlug
        - authorImageUrl
        - authorNobelPrizes
        - title
        - description
        - approach
        - link
        - createdAt
        - voteScore
        - userVote
    VoteSolutionInput:
      type: object
      properties:
        direction:
          type: integer
          description: "1 = upvote, -1 = downvote, 0 = remove vote"
          enum: [1, -1, 0]
      required:
        - direction
    VoteSolutionResult:
      type: object
      properties:
        voteScore:
          type: integer
        userVote:
          type: ["integer", "null"]
      required:
        - voteScore
        - userVote
    CreateChallengeSolutionInput:
      type: object
      properties:
        title:
          type: string
          minLength: 3
          maxLength: 160
        description:
          type: string
          minLength: 10
          maxLength: 2000
        approach:
          type: string
          minLength: 10
          maxLength: 2000
        link:
          type: string
          maxLength: 500
      required:
        - title
        - description
        - approach
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error
    MessageResponse:
      type: object
      properties:
        success:
          type: boolean
        held:
          type: boolean
          description: >
            True when the message was held for an unclaimed living member and
            will be delivered once they claim their profile.
      required:
        - success
    Message:
      type: object
      properties:
        id:
          type: string
        senderId:
          type: string
        senderName:
          type: ["string", "null"]
        senderEmail:
          type: string
        subject:
          type: ["string", "null"]
        body:
          type: string
        read:
          type: boolean
        createdAt:
          type: string
          format: date-time
      required:
        - id
        - senderId
        - senderName
        - senderEmail
        - subject
        - body
        - read
        - createdAt
    MessageList:
      type: object
      properties:
        messages:
          type: array
          items:
            $ref: "#/components/schemas/Message"
        unreadCount:
          type: integer
      required:
        - messages
        - unreadCount
    SendMessageInput:
      type: object
      properties:
        recipientId:
          type: string
          description: Target member account id. Provide this OR profileSlug.
        profileSlug:
          type: string
          description: Target directory profile slug (routes to its owner). Provide this OR recipientId.
        subject:
          type: string
          maxLength: 200
        body:
          type: string
          minLength: 1
          maxLength: 5000
      required:
        - body
    AuthUser:
      type: object
      properties:
        id:
          type: string
        email:
          type: string
        name:
          type: ["string", "null"]
        image:
          type: ["string", "null"]
        isSuperAdmin:
          type: boolean
          description: Whether this account is a platform superadmin (admin portal access).
        isMentor:
          type: boolean
          description: Whether this account is flagged as a mentor (can publish mentoring courses).
        foundingMember:
          type: boolean
          description: Whether this account is a lifetime founding member (one-time founding purchase, applied directly or claimed after a guest checkout).
        onboarded:
          type: boolean
          description: Whether this account has completed the story-driven onboarding (server-side source of truth).
      required:
        - id
        - email
        - name
        - image
        - isSuperAdmin
        - isMentor
        - foundingMember
        - onboarded
    RegisterInput:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 3
        password:
          type: string
          minLength: 8
        name:
          type: string
          minLength: 1
      required:
        - email
        - password
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
      required:
        - email
        - password
    ProfileSource:
      type: object
      properties:
        title:
          type: string
        url:
          type: string
      required:
        - title
        - url
    ProfilePatent:
      type: object
      properties:
        title:
          type: string
        number:
          type: string
        year:
          type: string
        url:
          type: string
      required:
        - title
        - number
        - url
    ProfileGroup:
      type: string
      enum:
        - scientist
        - inventor
        - thought_leader
        - organization
    ProfileNobelPrize:
      type: object
      properties:
        category:
          type: string
        categoryCode:
          type: string
        awardYear:
          type: string
        motivation:
          type: string
        portion:
          type: string
      required:
        - category
        - categoryCode
        - awardYear
        - motivation
        - portion
    ProfileTimelineEntry:
      type: object
      properties:
        year:
          type: string
        title:
          type: string
        detail:
          type: string
      required:
        - year
        - title
        - detail
    ProfileStoryContribution:
      type: object
      properties:
        title:
          type: string
        detail:
          type: string
      required:
        - title
        - detail
    ProfileStoryTheme:
      type: object
      properties:
        accent:
          type: string
        accentSoft:
          type: string
        accentDeep:
          type: string
        heroFrom:
          type: string
        heroTo:
          type: string
        motif:
          type: string
        heroVariant:
          type: string
      required:
        - accent
        - accentSoft
        - accentDeep
        - heroFrom
        - heroTo
        - motif
    FeaturedProfileSummary:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        group:
          $ref: "#/components/schemas/ProfileGroup"
        field:
          type: string
        era:
          type: string
        imageUrl:
          type: ["string", "null"]
        nobelPrizes:
          type: array
          items:
            $ref: "#/components/schemas/ProfileNobelPrize"
      required:
        - id
        - slug
        - name
        - group
        - field
        - era
        - imageUrl
        - nobelPrizes
    FeaturedProfile:
      type: object
      properties:
        id:
          type: string
        slug:
          type: string
        name:
          type: string
        group:
          $ref: "#/components/schemas/ProfileGroup"
        field:
          type: string
        era:
          type: string
        summary:
          type: string
        contributions:
          type: array
          items:
            type: string
        quotes:
          type: array
          items:
            type: string
        imageUrl:
          type: ["string", "null"]
        relatedCategorySlugs:
          type: array
          items:
            type: string
        sources:
          type: array
          items:
            $ref: "#/components/schemas/ProfileSource"
        patents:
          type: array
          items:
            $ref: "#/components/schemas/ProfilePatent"
        nobelPrizes:
          type: array
          items:
            $ref: "#/components/schemas/ProfileNobelPrize"
        tagline:
          type: ["string", "null"]
        lifespan:
          type: ["string", "null"]
        birthplace:
          type: ["string", "null"]
        biography:
          type: array
          items:
            type: string
        timeline:
          type: array
          items:
            $ref: "#/components/schemas/ProfileTimelineEntry"
        storyContributions:
          type: array
          items:
            $ref: "#/components/schemas/ProfileStoryContribution"
        legacy:
          type: array
          items:
            type: string
        didYouKnow:
          type: array
          items:
            type: string
        storyTheme:
          anyOf:
            - $ref: "#/components/schemas/ProfileStoryTheme"
            - type: "null"
        verified:
          type: boolean
          description: >
            Whether this profile has an approved owner (Task #92). True once a
            superadmin approves a user's claim; drives the "Verified" badge.
      required:
        - id
        - slug
        - name
        - group
        - field
        - era
        - summary
        - contributions
        - quotes
        - imageUrl
        - relatedCategorySlugs
        - sources
        - patents
        - nobelPrizes
        - tagline
        - lifespan
        - birthplace
        - biography
        - timeline
        - storyContributions
        - legacy
        - didYouKnow
        - storyTheme
        - verified
    OnboardingRecord:
      type: object
      description: The saved structured onboarding record (Task #160).
      properties:
        path:
          type: string
          enum: [member, claimant]
        claimProfileSlug:
          type: ["string", "null"]
        role:
          type: ["string", "null"]
        interests:
          type: array
          items:
            type: string
        primaryGoal:
          type: ["string", "null"]
        ambition:
          type: ["string", "null"]
        insights:
          type: array
          items:
            type: string
